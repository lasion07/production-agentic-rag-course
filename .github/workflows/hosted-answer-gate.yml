name: Hosted answer release gate

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: Immutable GHCR candidate, including @sha256:digest
        required: true
        type: string
      expected_commit:
        description: Full 40-character source commit embedded as APP_VERSION
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  answer-regression:
    name: Human-approved Langfuse answer contracts (100%)
    runs-on: [self-hosted, staging]
    timeout-minutes: 45
    environment: staging-evaluation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Require a human-approved immutable answer dataset
        id: manifest
        run: >-
          python scripts/ci/validate_release_manifest.py
          --require-answer-approved
          --github-output "$GITHUB_OUTPUT"
      - name: Validate immutable candidate identity
        run: >-
          python scripts/ci/verify_release_candidate.py
          --image-ref '${{ inputs.image_ref }}'
          --expected-commit '${{ inputs.expected_commit }}'
      - name: Validate staging configuration without printing secrets
        env:
          RAG_STAGING_BASE_URL: ${{ vars.RAG_STAGING_BASE_URL }}
          RAG_API_KEY: ${{ secrets.RAG_API_KEY }}
          STAGING_ENV_FILE: ${{ vars.STAGING_ENV_FILE }}
        run: |
          test -n "$RAG_STAGING_BASE_URL"
          test -n "$RAG_API_KEY"
          test -n "$STAGING_ENV_FILE"
          test -f "$STAGING_ENV_FILE"
      - name: Deploy the exact candidate to staging with automatic health rollback
        run: >-
          ./deploy/release-image.sh promote
          '${{ vars.STAGING_ENV_FILE }}'
          '${{ inputs.image_ref }}'
      - name: Verify staging serves the candidate commit
        env:
          RAG_API_KEY: ${{ secrets.RAG_API_KEY }}
        run: >-
          python scripts/ci/verify_release_candidate.py
          --image-ref '${{ inputs.image_ref }}'
          --expected-commit '${{ inputs.expected_commit }}'
          --base-url '${{ vars.RAG_STAGING_BASE_URL }}'
      - name: Run Langfuse experiment gate
        uses: langfuse/experiment-action@b945f9bf921b24a4074306078f621cba729d173e # v1.0.10
        env:
          RAG_STAGING_BASE_URL: ${{ vars.RAG_STAGING_BASE_URL }}
          RAG_API_KEY: ${{ secrets.RAG_API_KEY }}
        with:
          langfuse_public_key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          langfuse_secret_key: ${{ secrets.LANGFUSE_SECRET_KEY }}
          langfuse_base_url: https://us.cloud.langfuse.com
          experiment_path: experiments/agentic_answer_gate.py
          dataset_name: ${{ steps.manifest.outputs.answer_dataset_name }}
          dataset_version: ${{ steps.manifest.outputs.answer_dataset_timestamp }}
          experiment_metadata: dataset_version=${{ steps.manifest.outputs.answer_dataset_version }},prompt_version=${{ steps.manifest.outputs.prompt_version }},retrieval_version=${{ steps.manifest.outputs.retrieval_version }},response_schema_version=${{ steps.manifest.outputs.response_schema_version }},model=${{ steps.manifest.outputs.model }},candidate_image=${{ inputs.image_ref }},candidate_commit=${{ inputs.expected_commit }}
          python_sdk_version: "4.15.1"
          should_fail_on_regression: "true"
          should_fail_on_script_error: "true"
          should_comment_on_pr: "false"
