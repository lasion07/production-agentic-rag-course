name: production-agentic-rag

services:
  db-migrate:
    profiles: ["migration"]
    image: ${RAG_API_IMAGE:?set immutable RAG_API_IMAGE}
    user: "10001:10001"
    command: ["alembic", "upgrade", "head"]
    environment:
      ENVIRONMENT: production
      SERVICE_ROLE: ingestion
      DEBUG: "false"
      OPENSEARCH_SCHEMA_MANAGEMENT_ENABLED: "false"
      POSTGRES_DATABASE_URL_FILE: /run/secrets/postgres_database_url
      JINA_API_KEY_FILE: /run/secrets/jina_api_key
      OPENSEARCH__HOST: ${OPENSEARCH_HOST:?set HTTPS OPENSEARCH_HOST}
      OPENSEARCH__USERNAME: ${OPENSEARCH_USERNAME:?set OPENSEARCH_USERNAME}
      OPENSEARCH__PASSWORD_FILE: /run/secrets/opensearch_password
      OPENSEARCH__VERIFY_CERTS: "true"
      OPENSEARCH__CA_CERTS: /run/secrets/opensearch_ca
      OPENSEARCH__INDEX_GENERATION: ${OPENSEARCH__INDEX_GENERATION:-v1}
      OPENSEARCH__READ_ALIAS_SUFFIX: ${OPENSEARCH__READ_ALIAS_SUFFIX:-read}
      OPENSEARCH__WRITE_ALIAS_SUFFIX: ${OPENSEARCH__WRITE_ALIAS_SUFFIX:-write}
    secrets:
      - postgres_database_url
      - jina_api_key
      - opensearch_password
      - opensearch_ca
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge

  opensearch-migrate:
    profiles: ["migration"]
    image: ${RAG_API_IMAGE:?set immutable RAG_API_IMAGE}
    user: "10001:10001"
    entrypoint: ["/usr/local/bin/rag-entrypoint"]
    environment:
      ENVIRONMENT: production
      SERVICE_ROLE: ingestion
      DEBUG: "false"
      OPENSEARCH_SCHEMA_MANAGEMENT_ENABLED: "false"
      POSTGRES_DATABASE_URL_FILE: /run/secrets/postgres_database_url
      JINA_API_KEY_FILE: /run/secrets/jina_api_key
      OPENSEARCH__HOST: ${OPENSEARCH_HOST:?set HTTPS OPENSEARCH_HOST}
      OPENSEARCH__USERNAME: ${OPENSEARCH_USERNAME:?set OPENSEARCH_USERNAME}
      OPENSEARCH__PASSWORD_FILE: /run/secrets/opensearch_password
      OPENSEARCH__VERIFY_CERTS: "true"
      OPENSEARCH__CA_CERTS: /run/secrets/opensearch_ca
      OPENSEARCH__INDEX_GENERATION: ${OPENSEARCH__INDEX_GENERATION:-v1}
      OPENSEARCH__READ_ALIAS_SUFFIX: ${OPENSEARCH__READ_ALIAS_SUFFIX:-read}
      OPENSEARCH__WRITE_ALIAS_SUFFIX: ${OPENSEARCH__WRITE_ALIAS_SUFFIX:-write}
    secrets:
      - postgres_database_url
      - jina_api_key
      - opensearch_password
      - opensearch_ca
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    init: true
    ports:
      - "80:80"
      - "443:443"
    environment:
      RAG_DOMAIN: ${RAG_DOMAIN:?set RAG_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 64M
    stop_grace_period: 20s
    networks:
      - edge

  api:
    image: ${RAG_API_IMAGE:?set immutable RAG_API_IMAGE}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    expose:
      - "8000"
    environment:
      ENVIRONMENT: production
      SERVICE_ROLE: api
      DEBUG: "false"
      OPENSEARCH_SCHEMA_MANAGEMENT_ENABLED: "false"
      API_AUTH_ENABLED: "true"
      API_RATE_LIMIT_ENABLED: "true"
      API_RATE_LIMIT_REQUESTS: ${API_RATE_LIMIT_REQUESTS:-60}
      API_GLOBAL_RATE_LIMIT_REQUESTS: ${API_GLOBAL_RATE_LIMIT_REQUESTS:-600}
      HEALTH_CHECK_TIMEOUT_SECONDS: ${HEALTH_CHECK_TIMEOUT_SECONDS:-2.0}
      TRUST_INCOMING_REQUEST_ID: "false"
      API_KEYS_FILE: /run/secrets/api_keys
      POSTGRES_DATABASE_URL_FILE: /run/secrets/postgres_database_url
      LLM_PROVIDER: openai
      LLM_MODEL: ${LLM_MODEL:?set LLM_MODEL}
      OPENAI_ALLOWED_MODELS: ${OPENAI_ALLOWED_MODELS:?set OPENAI_ALLOWED_MODELS}
      OPENAI_BASE_URL: https://api.openai.com/v1
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      JINA_API_KEY_FILE: /run/secrets/jina_api_key
      OPENSEARCH__HOST: ${OPENSEARCH_HOST:?set HTTPS OPENSEARCH_HOST}
      OPENSEARCH__USERNAME: ${OPENSEARCH_USERNAME:?set OPENSEARCH_USERNAME}
      OPENSEARCH__PASSWORD_FILE: /run/secrets/opensearch_password
      OPENSEARCH__VERIFY_CERTS: "true"
      OPENSEARCH__CA_CERTS: /run/secrets/opensearch_ca
      OPENSEARCH__INDEX_GENERATION: ${OPENSEARCH__INDEX_GENERATION:-v1}
      OPENSEARCH__READ_ALIAS_SUFFIX: ${OPENSEARCH__READ_ALIAS_SUFFIX:-read}
      OPENSEARCH__WRITE_ALIAS_SUFFIX: ${OPENSEARCH__WRITE_ALIAS_SUFFIX:-write}
      REDIS__HOST: ${REDIS_HOST:?set REDIS_HOST}
      REDIS__PORT: ${REDIS_PORT:-6379}
      REDIS__PASSWORD_FILE: /run/secrets/redis_password
      REDIS__SSL: "true"
      REDIS__SSL_CA_CERTS: /run/secrets/redis_ca
      REDIS__SSL_CERT_REQS: required
      REDIS__SOCKET_TIMEOUT: "1"
      REDIS__SOCKET_CONNECT_TIMEOUT: "1"
      LANGFUSE_ENABLED: "true"
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:?set HTTPS LANGFUSE_BASE_URL}
      LANGFUSE_PUBLIC_KEY_FILE: /run/secrets/langfuse_public_key
      LANGFUSE_SECRET_KEY_FILE: /run/secrets/langfuse_secret_key
      LANGFUSE_CAPTURE_CONTENT: ${LANGFUSE_CAPTURE_CONTENT:-false}
      ALLOW_PRODUCTION_CONTENT_CAPTURE: ${ALLOW_PRODUCTION_CONTENT_CAPTURE:-false}
      TELEGRAM__ENABLED: "false"
    secrets:
      - api_keys
      - postgres_database_url
      - postgres_ca
      - openai_api_key
      - jina_api_key
      - opensearch_password
      - opensearch_ca
      - redis_password
      - redis_ca
      - langfuse_public_key
      - langfuse_secret_key
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /app/data:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/live', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 3G
          pids: 256
        reservations:
          cpus: "0.25"
          memory: 512M
    stop_grace_period: 30s
    networks:
      - edge

  airflow-scheduler:
    profiles: ["ingestion"]
    image: ${RAG_AIRFLOW_IMAGE:?set immutable RAG_AIRFLOW_IMAGE}
    restart: unless-stopped
    init: true
    user: "50000:50000"
    command: ["airflow", "scheduler"]
    environment:
      ENVIRONMENT: production
      SERVICE_ROLE: ingestion
      DEBUG: "false"
      OPENSEARCH_SCHEMA_MANAGEMENT_ENABLED: "false"
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_FILE: /run/secrets/airflow_database_url
      POSTGRES_DATABASE_URL_FILE: /run/secrets/postgres_database_url
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      JINA_API_KEY_FILE: /run/secrets/jina_api_key
      OPENSEARCH__HOST: ${OPENSEARCH_HOST:?set HTTPS OPENSEARCH_HOST}
      OPENSEARCH__USERNAME: ${OPENSEARCH_USERNAME:?set OPENSEARCH_USERNAME}
      OPENSEARCH__PASSWORD_FILE: /run/secrets/opensearch_password
      OPENSEARCH__VERIFY_CERTS: "true"
      OPENSEARCH__CA_CERTS: /run/secrets/opensearch_ca
      OPENSEARCH__INDEX_GENERATION: ${OPENSEARCH__INDEX_GENERATION:-v1}
      OPENSEARCH__READ_ALIAS_SUFFIX: ${OPENSEARCH__READ_ALIAS_SUFFIX:-read}
      OPENSEARCH__WRITE_ALIAS_SUFFIX: ${OPENSEARCH__WRITE_ALIAS_SUFFIX:-write}
    secrets:
      - airflow_database_url
      - postgres_database_url
      - postgres_ca
      - openai_api_key
      - jina_api_key
      - opensearch_password
      - opensearch_ca
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /opt/airflow/logs:rw,noexec,nosuid,size=512m
      - /opt/airflow/data:rw,noexec,nosuid,size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 4G
          pids: 512
        reservations:
          cpus: "0.25"
          memory: 512M
    stop_grace_period: 60s
    networks:
      - edge

networks:
  edge:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:

secrets:
  api_keys:
    file: ${PRODUCTION_SECRETS_DIR:?set PRODUCTION_SECRETS_DIR}/api_keys
  postgres_database_url:
    file: ${PRODUCTION_SECRETS_DIR:?set PRODUCTION_SECRETS_DIR}/postgres_database_url
  postgres_ca:
    file: ${PRODUCTION_SECRETS_DIR:?set PRODUCTION_SECRETS_DIR}/postgres_ca
  openai_api_key:
    file: ${PRODUCTION_SECRETS_DIR:?set PRODUCTION_SECRETS_DIR}/openai_api_key
  jina_api_key:
    file: ${PRODUCTION_SECRETS_DIR:?set PRODUCTION_SECRETS_DIR}/jina_api_key
  opensearch_password:
    file: ${PRODUCTION_SECRETS_DIR:?set PRODUCTION_SECRETS_DIR}/opensearch_password
  opensearch_ca:
    file: ${PRODUCTION_SECRETS_DIR:?set PRODUCTION_SECRETS_DIR}/opensearch_ca
  redis_password:
    file: ${PRODUCTION_SECRETS_DIR:?set PRODUCTION_SECRETS_DIR}/redis_password
  redis_ca:
    file: ${PRODUCTION_SECRETS_DIR:?set PRODUCTION_SECRETS_DIR}/redis_ca
  langfuse_public_key:
    file: ${PRODUCTION_SECRETS_DIR:?set PRODUCTION_SECRETS_DIR}/langfuse_public_key
  langfuse_secret_key:
    file: ${PRODUCTION_SECRETS_DIR:?set PRODUCTION_SECRETS_DIR}/langfuse_secret_key
  airflow_database_url:
    file: ${PRODUCTION_SECRETS_DIR:?set PRODUCTION_SECRETS_DIR}/airflow_database_url
